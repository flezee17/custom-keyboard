name: Build APK from Zip

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Unpack CustomBoard
        run: |
          unzip -o CustomBoard*.zip

      - name: Patch Resources & Fix Themes
        run: |
          # Создаем базовые стили, чтобы компилятор не ругался на отсутствие темы
          mkdir -p app/src/main/res/values
          cat << 'EOF' > app/src/main/res/values/themes.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.CustomBoard" parent="Theme.MaterialComponents.DayNight.NoActionBar" />
          </resources>
          EOF
          sed -i 's/@style\/Theme.Material3.Dark.NoActionBar/@style\/Theme.CustomBoard/g' app/src/main/AndroidManifest.xml

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CustomBoard-APK
          path: app/build/outputs/apk/debug/app-debug.apk
